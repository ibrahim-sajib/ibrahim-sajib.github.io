<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />

    <title>Md Ibrahim | Moments</title>
    <meta name="description" content="Memorable highlights of Md Ibrahim." />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" />

    <!-- CSS Files -->
    <link rel="stylesheet" href="/assets/css/terminal.css" />
    <link rel="canonical" href="/moments/" />

    <!-- Scripts -->
    <script src="/assets/js/terminal-shell.js" defer></script>
  </head>
  <body>
    <div class="content-wrapper" id="moments">
      <h1>Moments</h1>
      <p style="margin-bottom: 25px;">🎉 Memorable highlights ✨</p>

      <div class="moments-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px;">
        <div class="card p-2">
          <img class="card-img-top" src="../assets/img/moments/codefista.png" alt="Programming Contest" style="width: 100%; height: auto; border-radius: 4px; border: 1px solid var(--border-color);" />
          <div class="card-body">
            <h6 class="card-title mt-2">Inter university Programming Contest, <b>Dhaka</b>, Bangladesh</h6>
          </div>
        </div>

        <div class="card p-2">
          <img class="card-img-top" src="../assets/img/moments/ruet-iupc1.jpg" alt="RUET IUPC" style="width: 100%; height: auto; border-radius: 4px; border: 1px solid var(--border-color);" />
          <div class="card-body">
            <h6 class="card-title mt-2">Attending the RUET IUPC, <b>Rajshahi</b>, Bangladesh</h6>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
